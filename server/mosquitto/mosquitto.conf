allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/

# Interne au reseau Docker uniquement (non publie sur l'hote) : utilise par l'API
listener 1883

# Expose : MQTTS (TLS) pour l'ESP8266
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# Limites anti-DoS / MCO
max_connections 20
message_size_limit 4096
max_queued_messages 200
log_dest stdout
log_type error
log_type warning
log_type notice
