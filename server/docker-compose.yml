name: sentinel-x

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"   # MQTTS pour l'ESP8266 (le 1883 reste interne au reseau Docker)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    security_opt: ["no-new-privileges:true"]
    networks: [internal]   # pas de port publie

  api:
    build: ./api
    restart: unless-stopped
    depends_on: [mosquitto, db]
    environment:
      DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinel
      API_KEY: ${API_KEY:?missing}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_API_USER}
      MQTT_PASSWORD: ${MQTT_API_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - ../dashboard:/app/dashboard:ro
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]

networks:
  internal:

volumes:
  mosquitto-data:
  db-data:
