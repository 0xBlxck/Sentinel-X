[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_flags = -DMQTT_MAX_PACKET_SIZE=512
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
    adafruit/DHT sensor library@^1.4
    adafruit/Adafruit Unified Sensor@^1.1
    adafruit/Adafruit SSD1306@^2.5
    adafruit/Adafruit GFX Library@^1.11

; Pont USB (sans Wi-Fi) : pio run -e bridge -t upload
[env:bridge]
extends = env:nodemcuv2
build_flags = ${env:nodemcuv2.build_flags} -DSERIAL_BRIDGE
